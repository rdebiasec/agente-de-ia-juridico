# Paridad local/prod.
#
# Desarrollo típico (servidor en el Mac, DB en Docker):
#   ./scripts/start-local.sh
#   → scripts/local_db.sh levanta `db` y espera healthcheck
#   → luego uvicorn en :8000 con DATABASE_URL=...@localhost:5432
#
# Todo en Docker:
#   docker compose -f deploy/docker-compose.yml up --build
#   → `app` depende de `db` (service_healthy)

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=agente
      - POSTGRES_PASSWORD=agente
      - POSTGRES_DB=agente
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agente -d agente"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    # No usar env_file: ../.env aquí: Compose interpola `$` del hash SITE_PASSWORD
    # y emite warnings. Pase secretos con --env-file al hacer `compose up app`,
    # o exporte las vars en el shell. start-local.sh (host) carga .env vía load_dotenv.
    environment:
      # Paridad dev==prod: la app habla con el Postgres del compose.
      - DATABASE_URL=postgresql+psycopg://agente:agente@db:5432/agente
      - SESSION_COOKIE_SECURE=false
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
