# Blueprint Render — conectar repo GitHub y desplegar en un clic
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: agente-de-ia-juridico
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    # starter = always-on (Socket Mode Slack no sobrevive al sleep del plan free)
    plan: starter
    region: oregon
    branch: main
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SITE_USERNAME
        value: despacho
      - key: SITE_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DATA_AT_REST_KEY
        sync: false
      - key: SESSION_IDLE_MINUTES
        value: "60"
      - key: AUDIT_ALLOWED_EMAILS
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SESSION_MAX_MESSAGES
        value: "120"
      - key: AGENT_MAX_TURNS
        value: "25"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DEV_AUTO_LOGIN
        value: "false"
      - key: APP_DEBUG
        value: "false"
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_MODEL_HIGH_RISK
        value: gpt-4.1
      - key: AGENT_TEMPERATURE
        value: "0.2"
      - key: AGENT_TEMPERATURE_HIGH_RISK
        value: "0.1"
      - key: AGENT_MAX_TOTAL_TOKENS
        value: "30000"
      - key: OPENAI_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: DATABASE_URL
        fromDatabase:
          name: agente-ia-juridico-db
          property: connectionString
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_APP_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_REVIEW_CHANNEL
        value: "#revision-abogado"
      - key: SLACK_APPROVER_IDS
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_ALERT_TO
        sync: false
      - key: TWILIO_STATUS_CALLBACK
        sync: false

# Base autoritativa única (plan básico, sin expiración).
# Adopta la instancia existente agente-ia-juridico-db; no declarar la gratis.
databases:
  - name: agente-ia-juridico-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "18"
    databaseName: agente_b427
    user: agente
